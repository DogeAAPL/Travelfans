<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/imports/icono.png" />
    <title>TravelFans | Viajes a Perú, Colombia, Panamá y Brasil</title>
    <meta
      name="description"
      content="Agencia de viajes especializada en Latinoamérica. Paquetes a Perú, Colombia, Panamá y Brasil con cotización personalizada por WhatsApp."
    />
    <meta name="theme-color" content="#9333ea" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, etc.).
         Cuando el sitio tenga dominio, agrega og:url y og:image con URLs absolutas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TravelFans" />
    <meta property="og:locale" content="es_LA" />
    <meta property="og:title" content="TravelFans | Viajes a Perú, Colombia, Panamá y Brasil" />
    <meta
      property="og:description"
      content="Paquetes de viaje por Latinoamérica con cotización personalizada por WhatsApp."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://images.unsplash.com" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <noscript>TravelFans necesita JavaScript para mostrarse. Escríbenos por WhatsApp para cotizar tu viaje.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
